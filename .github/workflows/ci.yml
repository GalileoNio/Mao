name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go run ./cmd/mao check "./examples/..."
      - run: go run ./cmd/mao build "./examples/..."
      - run: go run ./cmd/mao test ./examples/mixed
      - run: go run ./cmd/mao fmt ./examples
      - run: git diff --exit-code

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go test -run "^$" -bench . ./runtime
